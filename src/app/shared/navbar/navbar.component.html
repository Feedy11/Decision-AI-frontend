<!-- ===== Navbar : logo + profile ===== -->
<nav class="navbar" *ngIf="!isPublicRoute">
  <div class="navbar-brand">
    <div class="brand-logo" (click)="goToDashboard()" style="cursor:pointer">
      <svg width="36" height="36" viewBox="0 0 40 40" fill="none">
        <rect width="40" height="40" rx="10" fill="url(#grad)" />
        <path d="M10 20 L20 10 L30 20 L20 30 Z" fill="white" fill-opacity="0.85" />
        <circle cx="20" cy="20" r="5" fill="white" />
        <defs>
          <linearGradient id="grad" x1="0" y1="0" x2="40" y2="40">
            <stop offset="0%" stop-color="#2563EB" />
            <stop offset="100%" stop-color="#7C3AED" />
          </linearGradient>
        </defs>
      </svg>
      <span class="brand-name">Decision <span class="brand-ai">AI</span></span>
    </div>
  </div>

  <!-- Spacer -->
  <div class="navbar-spacer"></div>

  <!-- Profile section (right side) -->
  <div class="navbar-profile" id="navbar-profile">
    <div class="profile-trigger" (click)="toggleProfileDropdown()">
      <div class="navbar-avatar" *ngIf="!avatarUrl">{{ userInitials }}</div>
      <img *ngIf="avatarUrl" [src]="avatarUrl" alt="Avatar" class="navbar-avatar-img" />
      <span class="navbar-user-name">{{ userFullName }}</span>
      <lucide-icon name="chevron-down" [size]="14" [strokeWidth]="2" class="dropdown-chevron" [class.open]="profileDropdownOpen"></lucide-icon>
    </div>

    <!-- Dropdown -->
    <div class="profile-dropdown" *ngIf="profileDropdownOpen">
      <div class="dropdown-header">
        <div class="dropdown-user-name">{{ userFullName }}</div>
        <div class="dropdown-user-role">{{ isAdmin ? ('navbar.admin' | transloco) : ('navbar.user' | transloco) }}</div>
      </div>
      <div class="dropdown-divider"></div>
      <a class="dropdown-item" (click)="goToProfile(); closeDropdown()">
        <lucide-icon name="user" [size]="16" [strokeWidth]="2"></lucide-icon>
        <span>{{ 'navbar.myProfile' | transloco }}</span>
      </a>
      <div class="dropdown-divider"></div>
      <a class="dropdown-item dropdown-item--danger" (click)="logout()">
        <lucide-icon name="log-out" [size]="16" [strokeWidth]="2"></lucide-icon>
        <span>{{ 'navbar.logout' | transloco }}</span>
      </a>
    </div>
  </div>
</nav>

<!-- ===== Backdrop mobile (ferme la sidebar au clic) ===== -->
<div class="sidebar-backdrop" *ngIf="showMobileBackdrop" (click)="onBackdropClick()"></div>

<!-- ===== Panel sidebar (width 0 → 260px, comme le chat panel) ===== -->
<div class="sidebar-panel" [class.open]="isOpen" *ngIf="!isPublicRoute">

  <!-- Header sidebar : bouton fermer -->
  <div class="sidebar-header">
    <span class="sidebar-title">Menu</span>
    <button class="close-btn" (click)="close()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">

    <!-- ═══ Workflow Section ═══ -->
    <div class="nav-section">
      <span class="nav-section-label">Workflow</span>

      <a class="nav-item workflow-item" (click)="startWorkflow()">
        <span class="nav-icon workflow-icon">
          <lucide-icon name="sparkles" [size]="18" [strokeWidth]="2"></lucide-icon>
        </span>
        <span>Démarrer le Workflow</span>
        <span class="nav-arrow">→</span>
      </a>

      <!-- Workflow steps with progressive access -->
      <a routerLink="/workflow/upload" routerLinkActive="active" class="nav-item nav-item--sub"
        [class.nav-item--locked]="!wf.canAccessRoute('/workflow/upload')">
        <span class="nav-icon"><lucide-icon name="upload-cloud" [size]="16" [strokeWidth]="2"></lucide-icon></span>
        <span>Upload</span>
        <lucide-icon *ngIf="wf.allSteps[0]?.completed" name="check" [size]="14" [strokeWidth]="2.5"
          class="step-done-icon"></lucide-icon>
      </a>

      <a routerLink="/workflow/cleaning" routerLinkActive="active" class="nav-item nav-item--sub"
        [class.nav-item--locked]="!wf.canAccessRoute('/workflow/cleaning')">
        <span class="nav-icon"><lucide-icon name="sparkles" [size]="16" [strokeWidth]="2"></lucide-icon></span>
        <span>Nettoyage</span>
        <lucide-icon *ngIf="wf.allSteps[1]?.completed" name="check" [size]="14" [strokeWidth]="2.5"
          class="step-done-icon"></lucide-icon>
        <lucide-icon *ngIf="!wf.allSteps[1]?.accessible" name="lock" [size]="12" [strokeWidth]="2"
          class="step-lock-icon"></lucide-icon>
      </a>

      <a routerLink="/workflow/analysis" routerLinkActive="active" class="nav-item nav-item--sub"
        [class.nav-item--locked]="!wf.canAccessRoute('/workflow/analysis')">
        <span class="nav-icon"><lucide-icon name="bar-chart-2" [size]="16" [strokeWidth]="2"></lucide-icon></span>
        <span>Analyse</span>
        <lucide-icon *ngIf="wf.allSteps[2]?.completed" name="check" [size]="14" [strokeWidth]="2.5"
          class="step-done-icon"></lucide-icon>
        <lucide-icon *ngIf="!wf.allSteps[2]?.accessible" name="lock" [size]="12" [strokeWidth]="2"
          class="step-lock-icon"></lucide-icon>
      </a>

      <a routerLink="/workflow/dashboard" routerLinkActive="active" class="nav-item nav-item--sub"
        [class.nav-item--locked]="!wf.canAccessRoute('/workflow/dashboard')">
        <span class="nav-icon"><lucide-icon name="layout-dashboard" [size]="16" [strokeWidth]="2"></lucide-icon></span>
        <span>Dashboard</span>
        <lucide-icon *ngIf="wf.allSteps[3]?.completed" name="check" [size]="14" [strokeWidth]="2.5"
          class="step-done-icon"></lucide-icon>
        <lucide-icon *ngIf="!wf.allSteps[3]?.accessible" name="lock" [size]="12" [strokeWidth]="2"
          class="step-lock-icon"></lucide-icon>
      </a>
    </div>

    <!-- Main Section -->
    <div class="nav-section">
      <span class="nav-section-label">Menu</span>

      <a routerLink="/datasets" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><lucide-icon name="database" [size]="18" [strokeWidth]="2"></lucide-icon></span>
        <span>Datasets</span>
        <span class="nav-badge" *ngIf="datasetCount > 0">{{ datasetCount }}</span>
      </a>

      <a routerLink="/cleaning" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><lucide-icon name="sparkles" [size]="18" [strokeWidth]="2"></lucide-icon></span>
        <span>Nettoyage</span>
      </a>

      <a routerLink="/analysis" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><lucide-icon name="bar-chart-2" [size]="18" [strokeWidth]="2"></lucide-icon></span>
        <span>Analytique</span>
      </a>

      <a routerLink="/kpis" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><lucide-icon name="activity" [size]="18" [strokeWidth]="2"></lucide-icon></span>
        <span>KPIs</span>
      </a>

      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
        <span class="nav-icon"><lucide-icon name="layout-dashboard" [size]="18" [strokeWidth]="2"></lucide-icon></span>
        <span>Tableau de bord</span>
      </a>

      <a routerLink="/report" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><lucide-icon name="file-text" [size]="18" [strokeWidth]="2"></lucide-icon></span>
        <span>Rapport</span>
      </a>
    </div>

    <!-- Admin Section -->
    <div class="nav-section" *ngIf="isAdmin">
      <span class="nav-section-label">Administration</span>

      <a routerLink="/admin/users" routerLinkActive="active" class="nav-item admin-item">
        <span class="nav-icon"><lucide-icon name="users" [size]="18" [strokeWidth]="2"></lucide-icon></span>
        <span>Utilisateurs</span>
      </a>
    </div>

  </nav>

</div>

<!-- ===== Bouton toggle latéral (toujours visible, collé au bord droit du panel) ===== -->
<button class="sidebar-toggle-btn" *ngIf="!isPublicRoute" [class.panel-open]="isOpen" (click)="togglePanel()"
  title="{{ isOpen ? 'Fermer le menu' : 'Ouvrir le menu' }}">
  <div class="toggle-icon">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
    <span class="toggle-text">Menu</span>
  </div>
</button>

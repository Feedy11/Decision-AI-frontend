<!-- ═══ Workflow Stepper (affiché uniquement sur les routes /workflow/*) ═══ -->
<div class="stepper-bar" *ngIf="isVisible">

  <!-- Progress bar background -->
  <div class="stepper-progress-track">
    <div class="stepper-progress-fill" [style.width.%]="wf.progressPercent"></div>
  </div>

  <div class="stepper-inner">

    <!-- Steps row -->
    <div class="stepper-steps">
      <ng-container *ngFor="let step of steps; let i = index; let last = last">

        <!-- Step circle + label -->
        <div class="step"
             [class.step--active]="step.active"
             [class.step--completed]="step.completed && !step.active"
             [class.step--locked]="!step.accessible"
             (click)="onStepClick(i)">

          <div class="step__circle">
            <!-- Current step: always show its own icon -->
            <lucide-icon *ngIf="step.active"
                         [name]="step.icon" [size]="18" [strokeWidth]="2"
                         class="step__icon">
            </lucide-icon>

            <!-- Past completed steps -->
            <lucide-icon *ngIf="!step.active && step.completed"
                         name="check" [size]="18" [strokeWidth]="2.5"
                         class="step__icon step__icon--check">
            </lucide-icon>

            <!-- Locked future steps -->
            <lucide-icon *ngIf="!step.active && !step.completed && !step.accessible"
                         name="lock" [size]="16" [strokeWidth]="2"
                         class="step__icon step__icon--lock">
            </lucide-icon>

            <!-- Unlocked but not yet reached -->
            <lucide-icon *ngIf="!step.active && !step.completed && step.accessible"
                         [name]="step.icon" [size]="18" [strokeWidth]="2"
                         class="step__icon">
            </lucide-icon>
          </div>

          <div class="step__text">
            <span class="step__label">{{ 'workflow.' + step.id + '.label' | transloco }}</span>
            <span class="step__desc">{{ 'workflow.' + step.id + '.desc' | transloco }}</span>
          </div>
        </div>

        <!-- Connector line -->
        <div class="step-connector" *ngIf="!last"
             [class.step-connector--done]="step.completed">
        </div>

      </ng-container>
    </div>

    <!-- Navigation buttons -->
    <div class="stepper-nav">
      <button class="stepper-btn stepper-btn--outline"
              [disabled]="currentIndex === 0"
              (click)="onPrevious()">
        <lucide-icon name="chevron-left" [size]="16" [strokeWidth]="2"></lucide-icon>
        {{ 'stepper.previous' | transloco }}
      </button>

      <span class="stepper-counter">
        {{ 'stepper.step' | transloco }} {{ currentIndex + 1 }} {{ 'stepper.of' | transloco }} {{ steps.length }}
      </span>

      <button class="stepper-btn stepper-btn--primary"
              *ngIf="currentIndex < steps.length - 1"
              [disabled]="!wf.canGoNext"
              (click)="onNext()">
        {{ 'stepper.next' | transloco }}
        <lucide-icon name="chevron-right" [size]="16" [strokeWidth]="2"></lucide-icon>
      </button>

      <!-- Dernière étape : Actions, affichées uniquement si le dashboard est chargé/calculé -->
      <div class="stepper-actions-done" *ngIf="currentIndex === steps.length - 1 && steps[currentIndex].completed">
        <span class="stepper-badge-done">
          <lucide-icon name="check" [size]="16" [strokeWidth]="2.5"></lucide-icon>
          {{ 'stepper.done' | transloco }}
        </span>
        
        <button class="stepper-btn stepper-btn--outline" (click)="onExit()">
          {{ 'stepper.exit' | transloco }}
        </button>
        <button class="stepper-btn stepper-btn--primary" (click)="onRestart()">
          <lucide-icon name="plus" [size]="16" [strokeWidth]="2"></lucide-icon>
          {{ 'stepper.new' | transloco }}
        </button>
      </div>
    </div>

  </div>
</div>
